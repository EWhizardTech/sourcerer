name: sourcerer_backend

services:
  api:
    build: .
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - redis
    ports:
      - "8001:8000"
    env_file:
      - .env

  worker:
    build: .
    command: celery -A app.workers.celery_app.celery worker --loglevel=info
    depends_on:
      - redis
    env_file:
      - .env

  redis:
    image: redis:latest
    ports:
      - "6380:6379"
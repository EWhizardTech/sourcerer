name: sourcerer

x-service-env: &service-env
  # torch.compile needs a C compiler the slim images lack; run eager.
  TORCHDYNAMO_DISABLE: "1"
  # Inside the compose network, Redis is reached via its service name.
  REDIS_URL: redis://redis:6379/2
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_BACKEND_URL: redis://redis:6379/1
  # Shared model/asset cache mounted at /srv/.cache
  ML_CACHE_DIR: /srv/.cache
  HF_HOME: /srv/.cache/huggingface
  HUGGINGFACE_HUB_CACHE: /srv/.cache/huggingface/hub
  TRANSFORMERS_CACHE: /srv/.cache/huggingface/transformers
  TORCH_HOME: /srv/.cache/torch
  NLTK_DATA_DIR: /srv/.cache/nltk_data
  SPACY_MODEL_DIR: /srv/.cache/spacy
  FASTEMBED_CACHE_PATH: /srv/.cache/fastembed

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      # Browser-side calls go to the gateway's published port.
      NEXT_PUBLIC_API_URL: http://localhost:8001
    depends_on:
      - gateway

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      INGESTION_URL: http://ingestion:8000
      RETRIEVAL_URL: http://retrieval:8000
      QUIZ_URL: http://quiz:8000
      # :3000 is the containerized frontend; :3001 is `next dev` run on the
      # host, which auto-increments while the container holds :3000.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    depends_on:
      - ingestion
      - retrieval
      - quiz

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      <<: *service-env
      GDRIVE_SERVICE_ACCOUNT_PATH: /srv/secrets/acc.json
    volumes:
      - ./secrets:/srv/secrets:ro
      - ./.cache:/srv/.cache
      - ./data:/srv/services/ingestion/data
    depends_on:
      - redis

  ingestion-worker:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery worker --loglevel=info
    env_file: [.env]
    environment:
      <<: *service-env
      GDRIVE_SERVICE_ACCOUNT_PATH: /srv/secrets/acc.json
    volumes:
      - ./secrets:/srv/secrets:ro
      - ./.cache:/srv/.cache
      - ./data:/srv/services/ingestion/data
    depends_on:
      - redis

  retrieval:
    build:
      context: .
      dockerfile: services/retrieval/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      <<: *service-env
    volumes:
      - ./.cache:/srv/.cache
    depends_on:
      - redis

  quiz:
    build:
      context: .
      dockerfile: services/quiz/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      <<: *service-env
    volumes:
      - ./.cache:/srv/.cache

  redis:
    image: redis:latest
    ports:
      - "6380:6379"

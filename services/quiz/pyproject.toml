[project]
name = "sourcerer-quiz"
version = "0.1.0"
description = "Quiz service: MCQ generation from retrieved course content."
requires-python = ">=3.13,<3.14"
dependencies = [
    "sourcerer-core",
    "fastapi>=0.135.1",
    "uvicorn>=0.42.0",
    "groq>=0.30.0,<1",
    "transformers>=5.5.0",
    "sentencepiece>=0.2.1",
    "nltk>=3.9.4",
    "spacy>=3.8.14",
    "scikit-learn>=1.8.0",
    # CPU wheels in Linux containers; CUDA for local Windows dev (see sources).
    "torch>=2.11.0",
]

[tool.uv]
package = false

[tool.uv.sources]
sourcerer-core = { workspace = true }
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

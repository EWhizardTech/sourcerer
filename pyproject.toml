[project]
name = "sourcerer-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.135.1",
    "google-api-python-client>=2.193.0",
    "google-auth>=2.49.1",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.42.0",
    "qdrant-client[fastembed]>=1.13.2",
    "pydantic>=2.12.5",
    "celery>=5.6.3",
    "redis>=7.4.0",
    "pytest>=9.0.2",
    "docling>=2.82.0",
    "pymupdf>=1.26.5",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "groq>=0.30.0,<1",
    "google-genai>=1.69.0",
    "streamlit>=1.42.0",
    "requests>=2.32.3",
    "langgraph>=1.1.6",
    "langchain-groq>=1.1.2",
    "tavily-python>=0.7.23",
    "transformers>=5.5.0",
    "sentencepiece>=0.2.1",
    "nltk>=3.9.4",
    "spacy>=3.8.14",
    "scikit-learn>=1.8.0",
]

[dependency-groups]
dev = [
    "huggingface-hub>=1.8.0",
    "pytest>=9.0.2",
]
 
[tool.uv.sources]
# CPU wheels in Linux containers (small, fast builds); CUDA wheels for local Windows dev.
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

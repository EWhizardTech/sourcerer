[project]
name = "sourcerer-ingestion"
version = "0.1.0"
description = "Ingestion service: Google Drive intake, parsing, chunking, tagging, embedding pipeline."
requires-python = ">=3.13,<3.14"
dependencies = [
    "sourcerer-core",
    "fastapi>=0.135.1",
    "uvicorn>=0.42.0",
    "celery>=5.6.3",
    "redis>=7.4.0",
    "docling>=2.82.0",
    "pymupdf>=1.26.5",
    "google-api-python-client>=2.193.0",
    "google-auth>=2.49.1",
    "groq>=0.30.0,<1",
    # CPU wheels in Linux containers; CUDA for local Windows dev (see sources).
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[tool.uv]
package = false

[tool.uv.sources]
sourcerer-core = { workspace = true }
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

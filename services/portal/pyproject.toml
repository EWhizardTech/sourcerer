[project]
name = "sourcerer-portal"
version = "0.1.0"
description = "Resource portal: Google sign-in, timed access grants, and in-app viewing of the owner's Drive library."
requires-python = ">=3.13,<3.14"
dependencies = [
    "sourcerer-core",
    "fastapi>=0.135.1",
    "uvicorn>=0.42.0",
    "httpx>=0.28.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pyjwt>=2.10.0",
    "google-api-python-client>=2.193.0",
    "google-auth>=2.49.1",
]

[tool.uv]
package = false

[tool.uv.sources]
sourcerer-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.0.0",
    "aiosqlite>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

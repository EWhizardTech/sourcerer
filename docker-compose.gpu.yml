# GPU override for the ingestion worker (docling acceleration):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# NOTE: images ship CPU torch (see [tool.uv.sources] in the service pyprojects).
# For CUDA in a container, point the linux torch source at a CUDA index,
# run `uv lock`, and rebuild that service's image.
services:
  ingestion-worker:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

[project]
name = "sourcerer-core"
version = "0.1.0"
description = "Shared library: config, embedding, vector store, structured retrieval."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "qdrant-client[fastembed]>=1.13.2",
    "google-genai>=1.69.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sourcerer_core"]

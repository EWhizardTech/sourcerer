[project]
name = "sourcerer-retrieval"
version = "0.1.0"
description = "Retrieval service: agentic RAG chat with streaming, memory, and reranking."
requires-python = ">=3.13,<3.14"
dependencies = [
    "sourcerer-core",
    "fastapi>=0.135.1",
    "uvicorn>=0.42.0",
    "langgraph>=1.1.6",
    "langchain-groq>=1.1.2",
    "tavily-python>=0.7.23",
    "redis>=7.4.0",
]

[tool.uv]
package = false

[tool.uv.sources]
sourcerer-core = { workspace = true }

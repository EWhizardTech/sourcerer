name: sourcerer_backend

services:
  api:
    build:
      context: .
    image: sourcerer-app:latest
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - redis
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      # Inside the compose network, Redis is reached via its service name.
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_BACKEND_URL: redis://redis:6379/1
    volumes:
      - ./secrets:/app/secrets:ro
      - ./.cache:/app/.cache

  worker:
    image: sourcerer-app:latest
    command: celery -A app.workers.celery_app.celery worker --loglevel=info
    depends_on:
      - api
      - redis
    env_file:
      - .env
    environment:
      # Inside the compose network, Redis is reached via its service name.
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_BACKEND_URL: redis://redis:6379/1
    volumes:
      - ./secrets:/app/secrets:ro
      - ./.cache:/app/.cache

  redis:
    image: redis:latest
    ports:
      - "6380:6379"

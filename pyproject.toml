[project]
name = "sourcerer"
version = "0.1.0"
description = "AI-powered RAG platform for educational content — microservice monorepo."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/sourcerer-core", "services/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "huggingface-hub>=1.8.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
